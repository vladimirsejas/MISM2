name: Testes do Escudo

on:
  pull_request:
  push:

# Os testes do sistema atual (sem banco: usam dados sintéticos e a
# base pública analises/base_preditiva_2013_2025.csv).
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala dependências
        run: pip install -r requirements.txt pyarrow
      - name: Inteligência (números do painel)
        working-directory: algoritimos
        run: python teste_inteligencia.py
      - name: Lia
        working-directory: algoritimos
        run: python teste_lia.py
      - name: Apoio à mulher (catálogo e Lia)
        working-directory: algoritimos
        run: python teste_apoio.py
      - name: Fluxo de pacientes (mulheres de outros estados atendidas em SP)
        working-directory: algoritimos
        run: |
          python teste_fluxo.py
          python teste_hospital.py
      - name: Unidades de saúde da cidade (CNES)
        working-directory: algoritimos
        run: python teste_unidades_saude.py
      - name: Comparar cidades (sem população)
        working-directory: algoritimos
        run: python teste_comparar.py
      - name: Conversa (fora do painel)
        working-directory: algoritimos
        run: python teste_conversa.py
      - name: Previsão com validação (backtest, comparação com repetir o último ano)
        working-directory: algoritimos
        run: python teste_previsao.py
      - name: Entendimento da pergunta (gabarito em 3 conjuntos x caixa antiga)
        working-directory: algoritimos
        run: python teste_entendimento.py
      - name: Assistente da Lia (Gemini simulado, conferência do texto, segurança)
        working-directory: algoritimos
        run: python teste_assistente.py
      - name: Pergunte à Lia no Apoio à mulher (busca no catálogo, segurança, sem gravar)
        working-directory: algoritimos
        run: python teste_apoio_busca.py
      - name: Carga e ferramentas do ETL
        working-directory: etl
        run: |
          python teste_carga_duplicidade.py
          python teste_carga_robusta.py
          python teste_carga_territorial.py
          python teste_selecao_csv.py
          python teste_deteccao_separador.py
          python teste_completude_meses.py
          python teste_investigar_2025.py
          python teste_baixar_sih_sp.py
          python teste_carga_fluxo.py
          python teste_criar_tabela_hospitais.py
      - name: Painel (clica em tudo)
        run: python dashboard/teste_painel.py
      - name: Lâmina de apoio (clica em tudo)
        run: python dashboard/teste_apoio_tela.py
      - name: Página Onde ser atendida (clica em tudo)
        run: python dashboard/teste_onde_atendida_tela.py
      - name: Onde ser atendida (lógica: CNES + catálogo conferido)
        working-directory: algoritimos
        run: python teste_onde_atendida.py
