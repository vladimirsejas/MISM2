name: Testes da rede local

on:
  push:
    branches:
      - melhoria-rede-rio-claro
  pull_request:
    branches:
      - main

jobs:
  testes-rede-local:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependência do módulo
        run: python -m pip install --upgrade pip pandas
      - name: Executar testes da rede local
        run: python -m unittest algoritimos.teste_rede_servicos_local -v
