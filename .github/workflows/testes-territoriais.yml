name: Testes Territoriais

on:
  pull_request:
  push:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install pandas

      - name: Teste territorial
        working-directory: algoritimos
        run: python teste_territorial.py
